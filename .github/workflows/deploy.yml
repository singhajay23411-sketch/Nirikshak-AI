name: Deploy Nirikshak AI to OCI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step A: Setup Node.js Environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # Step B: Install Dependencies & Compile Production Build
    - name: Install Frontend Dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build

    # Step C: Secure Transfer to OCI via SCP
    - name: Transfer Build Artifacts to OCI via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.OCI_HOST }}
        username: ${{ secrets.OCI_USER }}
        key: ${{ secrets.OCI_SSH_KEY }}
        source: "frontend/dist/*"
        target: "/var/www/nirikshak/temp_deploy"
        strip_components: 2

    # Step D: Deploy & Hot-Reload Nginx on OCI Server
    - name: Deploy Frontend & Reload Nginx
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.OCI_HOST }}
        username: ${{ secrets.OCI_USER }}
        key: ${{ secrets.OCI_SSH_KEY }}
        script: |
          sudo rm -rf /var/www/nirikshak/frontend/*
          sudo cp -r /var/www/nirikshak/temp_deploy/* /var/www/nirikshak/frontend/
          sudo rm -rf /var/www/nirikshak/temp_deploy
          sudo nginx -t
          sudo systemctl restart nginx
          echo "Deployment successfully executed and Nginx reloaded!"
